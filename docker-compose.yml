services:
  redis:
    image: redis:8.2.3-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes: [redis-data:/data]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: [/app/.venv/bin/python, -m, services.worker.main]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      redis: {condition: service_healthy}
    stop_grace_period: 200s
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import os,time; assert time.time()-os.stat('/tmp/nexus-worker-heartbeat').st_mtime<30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
        NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL}
        NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  redis-data:
