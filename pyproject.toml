[project]
name = "nexus-ai"
version = "0.1.0"
description = "Multi-tenant AI ticket intelligence engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "pyjwt[crypto]>=2.10,<3", "redis>=6,<8",
  "psycopg[binary,pool]>=3.2,<4", "openai>=2,<3", "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "fakeredis[lua]>=2.28,<3", "pyyaml>=6,<7", "types-PyYAML>=6,<7", "respx>=0.22,<1"]

[tool.pytest.ini_options]
pythonpath = ["services/api", "."]
testpaths = ["services/api/tests", "services/worker/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "services/api"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests", "node_modules"]
